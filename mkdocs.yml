site_name: gladia-normalization
site_description: Normalize speech-to-text transcripts for fair WER comparison
site_url: https://gladiaio.github.io/normalization/
repo_url: https://github.com/gladiaio/normalization
repo_name: gladiaio/normalization
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: concepts.md
  - Usage:
      - Python API: usage/python.md
      - CLI: usage/cli.md
  - Presets: presets.md
  - Languages: languages.md
  - Step reference: reference/steps.md
  - Contributing:
      - Overview: contributing/index.md
      - Contributor guide: contributing/guide.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gladiaio/normalization
    - icon: fontawesome/solid/globe
      link: https://gladia.io
